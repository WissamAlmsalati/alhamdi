# Render Blueprint for MiX / Al-Hami Group.
# Render dashboard → New → Blueprint → pick this repo. It creates:
#   mix-db       Postgres database
#   mix-backend  Laravel API + admin panel (Docker, backend/Dockerfile)
#   mix-site     React website (static)
databases:
  - name: mix-db
    databaseName: mix
    user: mix
    plan: free               # free Postgres expires after 30 days — for testing only

services:
  - type: web
    name: mix-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free               # testing only: sleeps when idle, and uploaded files are lost on each deploy/restart
    healthCheckPath: /up
    # For production switch to plan: starter and add a disk so uploads persist:
    # disk:
    #   name: uploads
    #   mountPath: /var/www/html/storage/app/public
    #   sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ar
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: mix-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false          # you enter it once when creating the Blueprint
      - key: ADMIN_PASSWORD
        generateValue: true  # copy it from the service's Environment tab
      # The website's public address, used by the admin panel's "view site" link.
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: mix-site
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Internal host of the backend; the site adds ".onrender.com" to reach it publicly.
      # To use a custom domain instead, set VITE_API_URL (e.g. https://api.example.com/api) in the dashboard.
      - key: VITE_API_HOST
        fromService:
          type: web
          name: mix-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
