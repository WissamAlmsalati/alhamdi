services:
  db:
    image: mysql:8.0
    container_name: alhamdi-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wahat_alteeb
      MYSQL_USER: wahat
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3308:3306"
    volumes:
      - wahat-mysql-data:/var/lib/mysql
    networks:
      - alhamdi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alhamdi-backend
    # Exposed only on localhost so host nginx can proxy the admin subdomain
    # (override the host port with ALHAMDI_BACKEND_PORT if 8000 is taken locally)
    ports:
      - "${ALHAMDI_BACKEND_PORT:-127.0.0.1:8000}:80"
    volumes:
      - ./backend/storage/app/public:/var/www/html/storage/app/public
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=https://backend.mix.com.ly
      - DB_CONNECTION=mysql
      - DB_HOST=alhamdi-db
      - DB_PORT=3306
      - DB_DATABASE=wahat_alteeb
      - DB_USERNAME=wahat
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alhamdi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: alhamdi-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - alhamdi-network

networks:
  alhamdi-network:
    driver: bridge

volumes:
  wahat-mysql-data:
